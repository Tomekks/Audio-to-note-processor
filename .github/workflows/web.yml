name: web

on:
  push:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "contracts/**"
      - "drizzle/**"
      - ".nvmrc"
      - "scripts/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "contracts/**"
      - "drizzle/**"
      - ".nvmrc"
      - "scripts/**"
      - ".github/workflows/web.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      # Dependabot-triggered runs don't get secrets.* (GitHub Actions
      # security restriction, not a bug) -- the production build needs
      # TURSO_DATABASE_URL and would fail on that alone. typecheck+lint+test
      # need no secrets and already catch real breakage on their own.
      - name: Verify
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            npm run verify
          else
            npm run verify:full
          fi
